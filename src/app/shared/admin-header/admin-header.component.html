<div class="admin-topbar d-flex align-items-center justify-content-between">
  <h4 class="title mb-0">Welcome to Admin Page {{Name}}</h4>
  <div class="right-icons d-flex align-items-center gap-3">
    <span class="date-time fw-semibold text-secondary" style="min-width: 180px; text-align: right;">{{ currentDateTime }}</span>
    <i class="bi bi-bell-fill fs-5"></i>
    <button class="btn btn-outline-dark btn-sm" (click)="logout()">
      <i class="bi bi-box-arrow-right"></i> Logout
    </button>
  </div>
</div>
