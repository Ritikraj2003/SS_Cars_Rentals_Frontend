<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <input type="text" class="form-control w-25" placeholder="Search..." [(ngModel)]="searchTerm" />
    <button class="btn btn-primary" (click)="createBookingType(bookingTypeFormTemplate)">
      <i class="bi bi-plus"></i> Add Booking_Type
    </button>
  </div>

  <div class="table-responsive">
    <table class="table table-bordered align-middle">
      <thead class="table-light text-center">
        <tr>
          <th>Booking ID</th>
          <th>Booking Type</th>
          <th style="width: 100px;">Action</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let item of paginatedData">
          <td>{{ item.bookingTypeId }}</td>
          <td>{{ item.type }}</td>
          <td class="text-center p-1">
            <div class="d-flex justify-content-center align-items-center gap-2">
              <i class="bi bi-eye text-info" role="button" title="View" (click)="ViewItem(item, bookingType)"></i>
              <i class="bi bi-pencil-square text-primary" role="button" (click)="editItem(item,bookingTypeFormTemplate)"></i>
              <i class="bi bi-trash text-danger" role="button" (click)="deleteBookingType(item)"></i>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="d-flex justify-content-end align-items-center gap-2">
    <button class="btn btn-outline-secondary btn-sm" [disabled]="currentPage === 1"
      (click)="previousPage()">Previous</button>
    <span>Page {{ currentPage }}</span>
    <button class="btn btn-outline-secondary btn-sm" [disabled]="currentPage * pageSize >= filteredData.length"
      (click)="nextPage()">Next</button>
  </div>
</div>


<ng-template #bookingTypeFormTemplate>
  <div class="modal-header">
    <h5 class="modal-title"> {{ isEditMode ? 'Edit Booking Type' : 'Add Booking Type' }}</h5>
    <button type="button" class="btn-close" aria-label="Close" (click)="close()"></button>
  </div>

  <div class="modal-body">
    <form [formGroup]="bookingTypeForm" (ngSubmit)="onSubmit()">
      <div class="mb-3">
        <label for="type" class="form-label">Booking Type</label>
        <input type="text" id="type" class="form-control" formControlName="type" placeholder="Enter booking type" />
        <div class="text-danger" *ngIf="bookingTypeForm.get('type')?.invalid && bookingTypeForm.get('type')?.touched">
          Booking Type is required
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="close()">Close</button>
        <button type="submit" class="btn btn-primary" [disabled]="bookingTypeForm.invalid"> {{ isEditMode ? 'Update' : 'Save' }}</button>
      </div>
    </form>
  </div>

</ng-template>


<ng-template #bookingType let-modal>
  <div class="modal-header">
    <h6 class="modal-title text-primary fw-bold">Booking Details</h6>
    <button type="button" class="btn-close" aria-label="Close" (click)="modal.dismiss()"></button>
  </div>

  <div class="modal-body">
    <h6 class="fw-bold mb-3 text-dark">Contact Details</h6>
    <div class="p-3 border rounded bg-light">
      <div class="row">
        <div class="col-4">
          <strong>Name</strong><br />
          <span>stactic</span>
        </div>
      </div>
    </div>
  </div>
</ng-template>
