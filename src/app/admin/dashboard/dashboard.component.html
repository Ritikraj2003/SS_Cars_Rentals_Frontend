<div class="top-section">
 <div class="widget-container">
  <div class="widget green">
    <div class="icon">
      <img src="assets/Dashborad/booking.png" alt="Booking" class="img-icon">
    </div>
    <div class="value">
      <div class="top">{{AllCount.total_Booking}}</div>
      <div class="bottom">Total Booking</div>
    </div>
  </div>
  <div class="widget yellow">
    <div class="icon">
      <img src="assets/Dashborad/car.png" alt="Car" class="img-icon">
    </div>
    <div class="value">
      <div class="top">{{AllCount.total_Car}}</div>
      <div class="bottom">Total Car</div>
    </div>
  </div>
  <div class="widget red">
    <div class="icon">
      <img src="assets/Dashborad/people.png" alt="Driver" class="img-icon">
    </div>
    <div class="value">
      <div class="top">{{AllCount.total_Driver}}</div>
      <div class="bottom">Total Driver</div>
    </div>
  </div>
  <div class="widget blue">
    <div class="icon">
      <img src="assets/Dashborad/contact-book.png" alt="Driver" class="img-icon">
    </div>
    <div class="value">
      <div class="top">{{AllCount.total_contacts}}</div>
      <div class="bottom">Total Contact</div>
    </div>
  </div>
  <div class="widget blue">
    <div class="icon">
       <img src="assets/Dashborad/money.png" alt="Driver" class="img-icon">
    </div>
    <div class="value">
      <div class="top">000</div>
      <div class="bottom">Total Revenue</div>
    </div>
  </div>
</div>
</div>

  <div class="widget left">
   
  </div>
  <div class="widget right">
   
<div class="chart-container" [chart]="chart"></div>

  </div>
</div>
<div class="bottom-section">
  <div class="widget left">
    
  </div>
  <div class="widget right">
    
  </div>
</div>
