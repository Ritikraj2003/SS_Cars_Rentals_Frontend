<div class="modal-header border-bottom align-items-center px-4 py-3" style="background: #f8f9fa; border-top-left-radius: 8px; border-top-right-radius: 8px;">
  <h4 class="modal-title fw-bolder mb-0 d-flex align-items-center" style="color: #2b4c7e; font-size: 1.35rem; letter-spacing: -0.5px;">
    <i class="fas fa-calendar-alt me-3" style="color: #fca020; font-size: 1.2rem;"></i> Book Your Ride
  </h4>
  <button type="button" class="btn-close shadow-none custom-close" aria-label="Close" (click)="closeModal()"></button>
</div>

<div class="modal-body p-4">
  <div *ngIf="!showForm" class="d-flex justify-content-center align-items-center" style="min-height: 200px;">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>

  <form *ngIf="showForm" [formGroup]="bookingForm" (ngSubmit)="onSubmit()" class="premium-form">
    <div class="row g-3">
      <!-- Row 1 -->
      <div class="col-md-6">
        <label class="form-label fw-semibold text-secondary mb-1">Car Type</label>
        <select formControlName="carType" class="form-select shadow-sm border-0 bg-light">
          <option value="">Select</option>
          <option *ngFor="let car of AllCars" [value]="car.carModel">{{ car.carModel }}</option>
        </select>
      </div>
      <div class="col-md-6">
        <label class="form-label fw-semibold text-secondary mb-1">Booking Type</label>
        <select formControlName="bookingType" class="form-select shadow-sm border-0 bg-light">
          <option value="">Select</option>
          <option *ngFor="let type of Bookingtypes" [value]="type.bookingName">{{ type.bookingName }}</option>
        </select>
      </div>

      <!-- Row 2 -->
      <div class="col-md-6">
        <label class="form-label fw-semibold text-secondary mb-1">Full Name</label>
        <input type="text" formControlName="name" class="form-control shadow-sm border-0 bg-light" placeholder="Enter your name" />
      </div>
      <div class="col-md-6">
        <label class="form-label fw-semibold text-secondary mb-1">Phone Number</label>
        <input type="text" formControlName="phone" class="form-control shadow-sm border-0 bg-light" placeholder="+91" />
      </div>

      <!-- Row 3 -->
      <div class="col-md-6">
        <label class="form-label fw-semibold text-secondary mb-1">Email Address</label>
        <input type="email" formControlName="email" class="form-control shadow-sm border-0 bg-light" placeholder="email@example.com" />
      </div>
      <div class="col-md-6">
        <label class="form-label fw-semibold text-secondary mb-1">Pickup Location</label>
        <input type="text" formControlName="pickupLocation" class="form-control shadow-sm border-0 bg-light" placeholder="Enter pickup location" />
      </div>

      <!-- Row 4 -->
      <div class="col-md-6">
        <label class="form-label fw-semibold text-secondary mb-1">Pickup Date</label>
        <input type="date" formControlName="pickupDate" class="form-control shadow-sm border-0 bg-light" />
      </div>
      <div class="col-md-6">
        <label class="form-label fw-semibold text-secondary mb-1">Pickup Time</label>
        <input type="time" formControlName="pickupTime" class="form-control shadow-sm border-0 bg-light" />
      </div>

      <!-- Row 5 -->
      <div class="col-md-6">
        <label class="form-label fw-semibold text-secondary mb-1">Drop Location</label>
        <input type="text" formControlName="dropLocation" class="form-control shadow-sm border-0 bg-light" placeholder="Enter drop location" />
      </div>
      <div class="col-md-6">
        <label class="form-label fw-semibold text-secondary mb-1">Drop Date</label>
        <input type="date" formControlName="dropDate" class="form-control shadow-sm border-0 bg-light" />
      </div>

      <!-- Row 6 -->
      <div class="col-md-6">
        <label class="form-label fw-semibold text-secondary mb-1">Drop Time</label>
        <input type="time" formControlName="dropTime" class="form-control shadow-sm border-0 bg-light" />
      </div>
      <div class="col-md-6">
        <label class="form-label fw-semibold text-secondary mb-1">Booking Date</label>
        <input type="date" formControlName="bookingDate" class="form-control shadow-sm border-0 bg-light" />
      </div>

      <!-- Row 7 -->
      <div class="col-12 mt-4">
        <div class="form-check form-switch">
          <input class="form-check-input shadow-none" type="checkbox" id="addCompany" formControlName="addCompany">
          <label class="form-check-label fw-semibold text-secondary" for="addCompany">Add Company Details (For Corporate Invoicing)</label>
        </div>
      </div>

      <!-- Row 8 -->
      <ng-container *ngIf="isCompanyEnabled">
        <div class="col-md-6">
          <label class="form-label fw-semibold text-secondary mb-1">Company Name</label>
          <input type="text" formControlName="companyName" class="form-control shadow-sm border-0 bg-light" placeholder="Your Company Ltd." />
        </div>
        <div class="col-md-6">
          <label class="form-label fw-semibold text-secondary mb-1">Company Details / GST</label>
          <input type="text" formControlName="companyDescription" class="form-control shadow-sm border-0 bg-light" placeholder="GSTIN or Address" />
        </div>
      </ng-container>
    </div>

    <div class="mt-4 pt-3 border-top text-center">
      <button type="button" class="btn btn-light px-4 py-2 me-2 shadow-sm rounded-pill" (click)="closeModal()">Cancel</button>
      <button type="submit" class="btn text-white px-5 py-2 shadow-sm rounded-pill" style="background-color: #fca020; font-weight: 600;">Confirm Booking</button>
    </div>
  </form>
</div>
